name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cargo-free gates: seconds, no toolchain, fail before the matrix spends
  # a build. scripts/check-layers.py = the crate layering contract.
  gates:
    name: layering gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crate layering
        run: python3 scripts/check-layers.py

  # Docs-only PRs skip the build matrix (absorbed 2026-10-14 from
  # photocraft's ci.yml `platforms` job, made conservative): the matrix
  # runs on EVERY push to master, on a PR touching anything outside the
  # docs allowlist, and on any PR labelled `full-ci`. Diff computed with
  # plain git against the PR base — no third-party action. An error in
  # this job (e.g. the base is unreachable) fails OPEN: code=true.
  changes:
    name: change classifier
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: python3 scripts/ci-classify.py >> "$GITHUB_OUTPUT"

  check:
    name: fmt + clippy + test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        # pinned via rust-toolchain.toml (1.97.0) — see file at repo root
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # lavapipe (Linux) / WARP (Windows) — headless software GPU for the
      # future golden-image tests. Installed now so the runner image is
      # proven early; GPU tests arrive with Wave 2/3 golden-image work.
      - name: Install lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Software GPU presence probe
        if: runner.os == 'Linux'
        run: |
          ls /usr/share/vulkan/icd.d/ || true

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
        # The GPU golden family (`renderer::tests::gpu`, 173 tests incl.
        # the height→normal goldens) is feature-gated behind `gpu`
        # (pollster device bootstrap); without this leg the workspace
        # run compiles umber-gpu WITHOUT it and the entire family is
        # silently skipped. Lavapipe satisfies the adapter.
      - name: GPU feature tests (Linux lavapipe)
        if: runner.os == 'Linux'
        run: cargo test -p umber-gpu --features gpu

      # Windows Ink backend: feature-gated behind `winink` (target-gated dep —
      # inert on Linux). Only windows-latest can actually compile+run the
      # WM_POINTER decode tests; this step is the backend's only real executor.
      - name: Stylus winink feature tests (Windows only)
        if: runner.os == 'Windows'
        run: cargo test -p stylus --features winink

      # OCIO bundled build (audit worklist #8): the vendored C++ tree
      # (Imath/Half/OCIO core) compiles ~2.5 min on 2 cores and runs the
      # real-mode test pair (the ACES 2.0 built-ins materialize; the
      # enum-name constants answer back). Linux-only for now: the bundled
      # path is where it was proven; Windows cross-build = named follow-up.
      - name: OCIO bundled build + real-mode tests (Linux only)
        if: runner.os == 'Linux'
        run: cargo test -p umber-color --features ocio-bundled

      - name: Build release smoke
        run: cargo build --release --workspace
