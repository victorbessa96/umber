# Linux packaging: AppImage build + Flatpak manifest validation.
#
# Split from ci.yml on purpose: the heavy jobs (a full release-profile
# compile plus ~1 GB of Flatpak SDK downloads) must NOT run on every push.
# Per-push proof is the `lint-packaging` job (manifest parse, desktop-file
# and AppStream validation — seconds, no SDK). AppImage production runs on
# `workflow_dispatch` and packaging-surface pushes; development Flatpak runs
# on `workflow_dispatch`. Tag-native production lives in release.yml after
# `host`. See flatpak/README.md and appimage/README.md for
# the v1 boundaries each job proves.

name: packaging

on:
  push:
    branches: [master]
    paths:
      - 'appimage/**'
      - 'flatpak/**'
      - '.github/workflows/packaging.yml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - 'appimage/**'
      - 'flatpak/**'
      - '.github/workflows/packaging.yml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Toolchain policy: appimagetool is pinned for the explicit pack step;
  # linuxdeploy and its type2 runtime are rolling (see appimage/README.md).
  APPIMAGETOOL_VERSION: '1.9.1'
  APPIMAGETOOL_URL: 'https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage'
  LINUXDEPLOY_URL: 'https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'

jobs:
  lint-packaging:
    name: lint packaging files (no SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The manifest may pin an ancestor, so depth 1 cannot prove its lockfile.
          fetch-depth: 0

      - name: Flatpak manifest parses as JSON
        run: python3 -m json.tool flatpak/org.umber.Umber.json > /dev/null

      - name: Manifest/runtime coupling assert
        run: python3 flatpak/check-runtime-coupling.py

      # The manifest is GENERATED from the pinned source commit's own
      # Cargo.lock + the .in template. The drift gate proves source and
      # vendor closure never come from different commits; it does not
      # pretend the development manifest tracks a different working-tree lock.
      - name: Flatpak manifest drift gate (regenerate + diff)
        run: |
          python3 flatpak/gen-cargo-sources.py --check

      - name: Install lint tools (no runtimes)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream flatpak-builder

      - name: Validate desktop files
        run: |
          desktop-file-validate flatpak/org.umber.Umber.desktop
          desktop-file-validate appimage/org.umber.Umber.desktop

      - name: Validate AppStream metainfo
        run: |
          appstreamcli validate flatpak/org.umber.Umber.metainfo.xml
          appstreamcli validate appimage/org.umber.Umber.metainfo.xml

      - name: Metainfo copies stay in sync
        run: diff -u flatpak/org.umber.Umber.metainfo.xml appimage/org.umber.Umber.metainfo.xml

      - name: Flatpak manifest schema smoke (--show-manifest parses, no SDK needed)
        run: flatpak-builder --show-manifest flatpak/org.umber.Umber.json > /dev/null

  appimage:
    name: build AppImage (x86_64)
    if: github.event_name != 'pull_request'
    needs: lint-packaging
    uses: ./.github/workflows/appimage-build.yml
    secrets: inherit
    with:
      attach-release: false

  flatpak:
    name: build Flatpak bundle (x86_64)
    needs: lint-packaging
    # Heaviest job (~1 GB runtime+SDK): manual development dispatch only.
    # Tag-native publication is owned by release.yml, which re-pins from the tag.
    if: github.event_name == 'workflow_dispatch'
    # ubuntu-latest rotated to ubuntu-26.04 (resolute) on 2026-10-21 and
    # that image's bwrap/rofiles sandbox dies at module-build setup
    # ("bwrap: Can't find source path .../rofiles/rofiles-*/files:
    # Permission denied") before the build command runs: the 10-19
    # dispatch (ubuntu-24.04) got PAST the sandbox and failed on content
    # (the vendor-checksums bug, fixed by 4d69808); the 10-23 dispatch
    # (ubuntu-26.04, zero packaging.yml/manifest delta between them —
    # git log names 1b0616c as the last workflow change, pre-rotation)
    # dies before vendor-checksums can start. Same rotation class as the
    # ci.yml check-matrix pin. Pinned to the last-known-good LTS image;
    # revisit when 26.04's bwrap/flatpak-builder stack is fixed upstream
    # or 24.04 approaches runner retirement. Evidence:
    # docs/loop/kill-reports/2026-10-23-flatpak-runner-pin.md
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak + builder (+ the SVG pixbuf loader the compose needs)
        run: |
          sudo apt-get update
          # librsvg2-common: flatpak-builder's export phase runs appstreamcli
          # compose host-side, and asc-image loads the hicolor SVG icon through
          # gdk-pixbuf — whose svg loader module ships in librsvg2-common, a
          # recommends-only package that --no-install-recommends skips. Without
          # it the compose dies 'E: file-read-error / Unrecognized image file
          # format' and drops the component (runs 40026754260, 40035240398).
          # Proof + mechanism:
          # docs/loop/kill-reports/2026-10-23-flatpak-compose-svg-loader.md
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common

      - name: Add Flathub + install 26.08 platform/SDK
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 org.freedesktop.Sdk.Extension.rust-stable//26.08

      - name: Build the Flatpak
        run: |
          # --disable-rofiles-fuse is runner hardening, NOT the compose fix: the
          # 26.04-rotation image died in the bwrap/rofiles layer before the
          # build could start (see the pin note above), and this workspace is
          # disposable, so the rofiles read-only guard buys nothing. The export
          # compose's 'E: file-read-error' was never the rofiles layer — the
          # no-rofiles run 40035240398 failed identically; the real mechanism
          # was the missing gdk-pixbuf svg loader, fixed one step above.
          # Evidence: docs/loop/kill-reports/2026-10-23-flatpak-compose-svg-loader.md
          sudo flatpak-builder --disable-rofiles-fuse --force-clean --repo=repo build-dir flatpak/org.umber.Umber.json

      - name: Export single-file bundle
        run: |
          sudo flatpak build-bundle repo Umber.flatpak org.umber.Umber --arch=x86_64
          sudo chown "$(id -u):$(id -g)" Umber.flatpak
          ls -la Umber.flatpak

      # Honest boundary: launching the GUI needs a display, so CI proves
      # build + bundle, not first-run. A human runs:
      #   flatpak install Umber.flatpak && flatpak run org.umber.Umber
      - name: Upload Flatpak bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Umber-flatpak-bundle
          path: Umber.flatpak
