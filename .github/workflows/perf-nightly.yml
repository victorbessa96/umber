name: perf-nightly

# The §12 protocol's regression gate (docs/perf/protocol.md): the nightly
# job runs the perf harnesses headless and compares against
# perf/baseline.json — a >10% regression on any budget fails the job, and
# so does a tracked metric the run did not produce (perf_compare.py), and
# so does a failing harness (the stroke soak's zero-drop assert).
# NOT per-commit (the load directive): failures here don't block merges;
# they surface the drift the protocol tracks.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch: {} # manual runs for the baseline refresh

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    # Hosted + lavapipe by default. `runs-on: [self-hosted]` alone queued
    # forever (zero runners registered: every nightly 10-13..15 sat queued
    # then cancelled). The 3070 runner opts in through the repo variable
    # PERF_RUNNER=self-hosted once it is online; until then the gate runs.
    runs-on: ${{ vars.PERF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install lavapipe (headless Vulkan)
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          # The ICD path differs by Ubuntu release: find it, never assume.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json /usr/share/vulkan/icd.d/*lavapipe*.json 2>/dev/null | head -1)
          test -n "$icd" || { echo "lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Build the perf harnesses
        run: cargo build --release -p umber-app -p umber-gpu --features perf

      - name: Run the perf harnesses (JSON out)
        env:
          UMBER_REF_SCENE_FRAMES: "1000"
          UMBER_REF_SCENE_JSON: /tmp/ref-scene.json
          UMBER_I2P_EVENTS: "5000"
          UMBER_I2P_JSON: /tmp/i2p.json
        # No `|| true`: a harness that fails (the stroke soak's zero-drop
        # assert, a panicking bench) fails the job. Every step still runs
        # (`set +e` + the exit tally) so one failure does not hide the
        # others' numbers.
        run: |
          # The harness tests are NOT #[ignore] (the 2026-10-12 seed run
          # proved: --ignored filtered EVERYTHING and the job compared an
          # empty report). One filter per invocation — cargo test takes
          # exactly one TESTNAME.
          set +e
          fail=0
          cargo test -p umber-gpu --features perf --release ref_scene_bench -- --nocapture || fail=1
          cargo test -p umber-app --features perf --release input_photon_session -- --nocapture || fail=1
          cargo test -p umber-app --features perf --release stroke_soak -- --nocapture || fail=1
          exit $fail

      - name: Compare against perf/baseline.json (>10% fails)
        if: always()
        run: python3 scripts/perf_compare.py /tmp/ref-scene.json /tmp/i2p.json perf/baseline.json

      - name: Upload the fresh numbers as the artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-${{ github.run_id }}
          path: |
            /tmp/ref-scene.json
            /tmp/i2p.json
          retention-days: 30
