name: perf-nightly

# The §12 protocol's regression gate (docs/perf/protocol.md): the nightly
# job runs the perf harnesses headless and gates them — A/B-instrumented
# since the 2026-10-30 instrument wave: scripts/perf_gate.sh benches the
# pinned reference commit PERF_AB_REF in the SAME job on the SAME runner
# and gates the RATIO current/reference (scripts/perf_compare_ab.py,
# band x1.10), because the hosted lavapipe fleet's throughput moves
# x1.16..x1.51 on identical code within a day and an absolute x1.10 band
# cannot resolve that. The absolute compare vs perf/baseline.json below
# is REPORT-ONLY. A harness failure (the stroke soak's zero-drop assert)
# still fails the job outright.
# NOT per-commit (the load directive): failures here don't block merges;
# they surface the drift the protocol tracks.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC nightly
  workflow_dispatch:
    # Manual runs for the baseline refresh, and the SAME-TIP FLEET CANARY
    # (docs/perf/protocol.md's named follow-up): `ref` pins the checkout to
    # any commit SHA while the workflow file itself stays on the dispatched
    # ref — so the canary at the baseline tip measures the fleet WITHOUT
    # pushing a scratch ref (the partner-gated action) and compares
    # against that tree's own perf/baseline.json (unchanged since the
    # 2026-10-19 reseed). Usage:
    #   gh workflow run perf-nightly.yml --ref master -f ref=<sha>
    inputs:
      ref:
        description: "Commit SHA to canary (empty = the dispatched ref)"
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    # Hosted + lavapipe by default. `runs-on: [self-hosted]` alone queued
    # forever (zero runners registered: every nightly 10-13..15 sat queued
    # then cancelled). The 3070 runner opts in through the repo variable
    # PERF_RUNNER=self-hosted once it is online; until then the gate runs.
    # The hosted default is PINNED to 24.04 (2026-10-24): ubuntu-latest
    # rotated to 26.04 on 2026-10-21 and every nightly since dies with the
    # panic_hunt suite hanging + restarting on the new image's adapter
    # stack — the same rotation class the ci.yml pin (c697bab) already
    # proved: the pinned 24.04 leg green on every run after it (CI run
    # 40020097585's full matrix). Evidence: three consecutive reds
    # (10-21 aac1c4a2 unchanged-tip, 10-22, 10-23 96edd1e4) all on
    # "Image: ubuntu-26.04". Revisit when 26.04's stack stabilizes
    # upstream, same revisit clause as the CI pin.
    runs-on: ${{ vars.PERF_RUNNER || 'ubuntu-24.04' }}
    # Gate 1 is 3 interleaved pass pairs (current + the pinned A/B
    # reference); a red adds the 2-pair canary leg — 120 min holds both
    # builds + the soak + five pairs + the compares with margin.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # The canary input pins the checkout to another commit; empty
          # (nightly schedule, plain dispatch) keeps the dispatched ref.
          ref: ${{ inputs.ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install lavapipe (headless Vulkan)
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          # The ICD path differs by Ubuntu release: find it, never assume.
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json /usr/share/vulkan/icd.d/*lavapipe*.json 2>/dev/null | head -1)
          test -n "$icd" || { echo "lavapipe ICD not found"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"

      - name: Build the perf harnesses
        run: cargo build --release -p umber-app -p umber-gpu --features perf

      - name: Run the A/B-instrumented perf gate (median-of-3 pairs + canary, ratio verdict)
        # perf_gate.sh owns the harness env vars, the interleaved A/B
        # reference leg, the N-pass medians, and the two-gate RATIO
        # verdict; its stdout carries every per-pass number. A harness
        # failure (the soak's zero-drop assert, a panicking bench) fails
        # the job before any comparison, as before.
        run: bash scripts/perf_gate.sh

      - name: Absolute compare vs perf/baseline.json (REPORT-ONLY)
        # The A/B ratio gate above owns the pass/fail verdict; this
        # absolute compare stays in the log for the §12 leg log and must
        # never fail the job on its own.
        if: always()
        run: python3 scripts/perf_compare.py /tmp/ref-scene.json /tmp/i2p.json perf/baseline.json || echo "::warning::absolute compare red (report-only) — the A/B ratio verdict above is authoritative"

      - name: Upload the fresh numbers as the artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-${{ github.run_id }}
          path: |
            /tmp/ref-scene.json
            /tmp/i2p.json
            /tmp/ref-r*.json
            /tmp/i2p-r*.json
            /tmp/ab-ref-scene.json
            /tmp/ab-i2p.json
            /tmp/ab-ref-r*.json
            /tmp/ab-i2p-r*.json
          retention-days: 30
