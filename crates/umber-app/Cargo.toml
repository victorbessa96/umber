[package]
name = "umber-app"
description = "Umber — open-source Rust-native 3D texture painting (Substance Painter class)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "umber"
path = "src/main.rs"

[dependencies]
umber-core = { workspace = true }
umber-mesh = { workspace = true }
umber-gpu = { workspace = true }
umber-brush = { workspace = true }
umber-bake = { workspace = true }
umber-export = { workspace = true }
umber-graph = { workspace = true }
umber-color = { workspace = true }
umber-wasm = { workspace = true }
umber-gui = { workspace = true }
stylus = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
rfd = "0.15"
# PSD import (flatten-on-import): the same ag-psd reader the export path
# uses (umber-export's `psd.rs`). Version already locked in Cargo.lock —
# no lock churn. The `mod psd_import;` + menu wiring lands at the
# wave-end merge (another claw owns main.rs' import section this wave).
ag-psd = "0.3.0"
umber-spp = { workspace = true }
# UI string catalogs (docs/specs/i18n-design.md): Fluent bundles over
# assets/i18n/*.ftl. umber-app only — no other crate renders UI text.
fluent = "0.17"
profiling = { workspace = true }

[features]
# Perf instrumentation backend (tracy). Off by default: with the feature
# off, every profiling::span! in the workspace compiles to nothing.
perf = ["profiling/profile-with-tracy"]

# §9 OCIO adoption: the Display panel's config selector + the OCIO view
# stage in the viewer chain (stub mode when ocio-bundled is absent: the
# section renders disabled with the honest "unavailable" note). The
# bundled C++ build is the heavy path (umber-color's ocio-bundled);
# CI runs the stub arm on every pass and the bundled leg on Linux.
ocio = ["umber-color/ocio"]

# Linux tablets: the stylus crate's XI2 backend ships with the app on
# Linux (x11-dl dlopens libX11/libXi at runtime; without an X display
# the backend reports unavailable and the Touch fallback rules).
[target.'cfg(target_os = "linux")'.dependencies]
stylus = { workspace = true, features = ["xi2"] }

[dev-dependencies]
pollster = { workspace = true }
wgpu = { workspace = true }
serde_json = { workspace = true }
