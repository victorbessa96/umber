[package]
name = "umber-spp"
description = "Umber .spp importer (read-only): HDF5-subset reader plus HBO classifier"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
thiserror = { workspace = true }
flate2 = { workspace = true }
# texture-cache channels are one raw LZ4 block each (research §7a).
# Already locked through openusd: 0.14.0, MIT, safe-decode (no unsafe).
# Pinned here, not in [workspace.dependencies]: the exact version the lock
# already resolves, so Cargo.lock gains one dependency edge and no
# package.
lz4_flex = { version = "=0.14.0", default-features = false, features = ["std", "safe-decode", "checked-decode"] }

[dev-dependencies]
# The corpus manifest (tests/corpus.rs): sha256-pinned oracle rows.
# Dev-only — the reader crate itself stays serde-free.
serde = { workspace = true }
serde_json = { workspace = true }
