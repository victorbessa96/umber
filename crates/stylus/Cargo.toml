[package]
name = "stylus"
description = "Umber stylus input: Windows Ink + Wintab (Windows), Wayland/X11 tablets (Linux)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
log = { workspace = true }

# windows-future / windows_threading (pulled in transitively) are only
# buildable for windows targets, unlike the `windows` crate's own generated
# bindings (which compile to nothing off-Windows via their own
# `#![cfg(windows)]`) — so this must be target-gated, not just feature-gated,
# or `--features winink` breaks the build on non-Windows hosts outright.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = ["Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

# x11-dl is a dlopen wrapper (no link-time X libs): it compiles on any
# Linux CI image and fails at RUNTIME (open() -> Err) without an X
# display, so the backend degrades to the touch fallback headlessly.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = { version = "2.21", optional = true }

[features]
winink = ["dep:windows"]
# Linux-only: the dep is target-gated above, so enabling this feature
# off-Linux is a manifest error by design, not a silent no-op.
xi2 = ["dep:x11-dl"]
