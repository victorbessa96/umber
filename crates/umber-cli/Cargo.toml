[package]
name = "umber-cli"
description = "Umber headless CLI: bake/export/batch automation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "umber-cli"
path = "src/main.rs"

[dependencies]
umber-bake = { workspace = true }
umber-brush = { workspace = true }
umber-core = { workspace = true }
umber-mesh = { workspace = true }
umber-export = { workspace = true }
umber-gpu = { workspace = true }
# The headless paint engine + persistence (agent paint ops): the SAME
# implementation the GUI paints and saves through — no egui in the tree.
umber-paint = { workspace = true }
# `extract-spp`: the read-only .spp reader (binding ruling 1).
umber-spp = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
# `emath::Pos2`: the paint engine's stroke-point type (egui's math
# crate, no UI).
emath = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# import-asset's typed ImportError (K5); already in the tree via
# umber-core/umber-brush.
thiserror = { workspace = true }
# Token generation for the serve control channel (absorbed 2026-11-01
# from storytold/texturecraft security.rs; getrandom 0.3.4 already in
# Cargo.lock). Promote to [workspace.dependencies] at the next wave close.
getrandom = "0.3"
# paint_snapshot's content hash (the same hash the paint sidecar's
# clean-skip uses).
blake3 = { workspace = true }
# Queue row 155: the MCP stdio server is served by the rmcp SDK on a
# tokio runtime; schemars derives the tool input schemas. The exposed
# tool catalog is pinned byte-identical by mcp.rs tests.
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "net", "time", "io-std", "io-util"] }
# Queue row 155: cap-std Dir handles for the confined workspace roots
# (workspace.rs) — openat-style resolution, symlink escapes refused by
# the capability itself.
cap-std = "4"

[dev-dependencies]
# The wire-level MCP test drives the server over a tokio duplex pair.
tokio = { version = "1", features = ["rt", "net", "time", "io-util"] }

[features]
default = ["gpu"]
gpu = ["umber-bake/gpu"]

# The Windows version resource (build.rs): SignPath requires product
# metadata on every signed binary. Target-gated in build.rs; only the
# windows-msvc job ever runs its resource compiler.
[build-dependencies]
winresource = { workspace = true }
